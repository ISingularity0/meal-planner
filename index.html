<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Familien-Essensplaner</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Deliberately "default", not "black-translucent": the latter moves the web view up to
         y=0 without growing its height, so the ~60pt shortfall just reappears at the bottom
         instead. The strip iOS paints above the view is blended away via background_color
         plus a matching fade at the top of the page background. Bonus: dark status bar text,
         which black-translucent forces to white and would be unreadable on this palette. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Essensplaner" />
    <link rel="apple-touch-icon" href="/meal-planner/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
